[package]
name = "codex-session-shelf-launcher"
version = "0.1.0"
description = "Codex Session Shelf launcher"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.0"
libc = "0.2"
